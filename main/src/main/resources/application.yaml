server:
  port: 8080

spring:
  datasource:
    url: "jdbc:mysql://localhost:3306/movie_management?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true"
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 1000
        order_inserts: true
        order_updates: true
  jackson:
    property-naming-strategy: SNAKE_CASE
