<!doctype html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>Tìm kiếm & Lọc phim - PHIMMOI</title>
    <link rel="icon" href="/media/logo.png" type="image/png" />
    <link rel="stylesheet" href="/css/style.css?v=6" />
</head>

<body>
    <header class="site-header">
        <div class="header-container">
            <div class="logo">
                <a href="/index.html">
                    <span class="logo-main">WEB</span><span class="logo-sub">PHIMMOI</span>
                </a>
            </div>

            <div class="search-wrapper" style="position: relative">
                <form class="search-box" method="GET" action="/search.html">
                    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18"
                        height="18" fill="currentColor">
                        <path
                            d="M10 2a8 8 0 016.32 12.9l4.387 4.387a1 1 0 01-1.414 1.414l-4.387-4.387A8 8 0 1110 2zm0 2a6 6 0 100 12 6 6 0 000-12z" />
                    </svg>
                    <input type="text" name="q" id="search-input" placeholder="Hôm nay có phim gì hay..."
                        autocomplete="off" />
                </form>

                <div id="search-dropdown" class="search-dropdown" style="display: none">
                    <div class="dropdown-header">Danh sách phim</div>
                    <div id="search-results-list"></div>
                </div>
            </div>

            <nav class="header-nav">
                <ul class="nav-list">
                    <li class="nav-item"><a href="/index.html">TRANG CHỦ</a></li>
                    <!-- ĐỔI DÒNG NÀY THÀNH LINK THẬT -->
                    <li class="nav-item"><a href="/following.html">THEO DÕI</a></li>
                    <li class="nav-item dropdown">
                        <a href="#" class="dropbtn">THỂ LOẠI</a>
                        <div class="dropdown-content" id="header-genres-dropdown"></div>
                    </li>
                    <li class="nav-item"><a href="#" id="random-movie-btn">NGẪU NHIÊN</a></li>
                </ul>
            </nav>

            <div class="header-actions" style="display: flex; gap: 10px; align-items: center;">
                <div id="auth-section"></div>
                <button class="theme-toggle" title="Mode">Mode: Sáng</button>
            </div>
        </div>
    </header>

    <main id="danh-sach-phim" class="content-wrapper">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px;">
            <h2 id="search-heading">Tất cả phim</h2>

            <div class="filter-container">
                <button type="button" id="filter-button" class="filter-button">FILTER</button>

                <div id="filter-popup" class="filter-popup" style="display: none">
                    <div class="filter-popup-header">
                        <h3>Bộ lọc</h3>
                    </div>

                    <!-- Thể loại -->
                    <div class="filter-section">
                        <h4>Thể loại</h4>
                        <div class="genre-list" id="filter-genre-list"></div>
                    </div>

                    <!-- Rating -->
                    <div class="filter-section">
                        <h4>Rating tối thiểu</h4>
                        <select id="min-rating" class="filter-select">
                            <option value="0">Tất cả</option>
                            <option value="6">6+</option>
                            <option value="7">7+</option>
                            <option value="8">8+</option>
                            <option value="9">9+</option>
                        </select>
                    </div>

                    <!-- Thời lượng -->
                    <div class="filter-section">
                        <h4>Thời lượng</h4>
                        <div class="runtime-values">
                            <span><span id="min-runtime-value">30</span> phút</span>
                            <span style="color: #666;">-</span>
                            <span><span id="max-runtime-value">240</span> phút</span>
                        </div>
                        <div class="runtime-slider">
                            <input type="range" id="min-runtime" min="30" max="240" value="30" step="1" />
                            <input type="range" id="max-runtime" min="30" max="240" value="240" step="1" />
                        </div>
                    </div>

                    <button type="button" id="apply-filter" data-url="/search.html" class="apply-filter">
                        ÁP DỤNG
                    </button>
                </div>
            </div>
        </div>

        <div class="movie-list-container">
            <div class="movie-grid-5" id="catalog-movies-grid"></div>
        </div>

        <div class="pagination">
            <div class="page-numbers" id="pagination-controls"></div>
        </div>
    </main>

    <script src="/js/header.js"></script>
    <script src="/js/BL_mode.js"></script>
    <script src="/js/live_search.js"></script>
    <script src="/js/filter.js"></script>
    <script src="/js/app.js"></script>
</body>

</html>
